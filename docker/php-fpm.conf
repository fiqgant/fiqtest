[www]
user = www-data
group = www-data
listen = 9000

; Dynamic process management - scales up/down based on load
pm = dynamic
pm.max_children = 40
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500

; Request timeout — must be higher than JUDGE0_TIMEOUT (30s) + buffer
request_terminate_timeout = 60s
